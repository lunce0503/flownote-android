name: Android staging APK
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: remote-terminal/terminal/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: ./gradlew --no-daemon :app:testDebugUnitTest :remote-terminal:testDebugUnitTest :app:assembleDebug
      - run: npm test --prefix remote-terminal/terminal
      - uses: actions/upload-artifact@v4
        with:
          name: flownote-android-staging
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
